<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Breeze</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0418"/>
      <stop offset="1" stop-color="#120726"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <clipPath id="listras">
      <rect x="640" y="40" width="240" height="22"/>
      <rect x="640" y="70" width="240" height="20"/>
      <rect x="640" y="98" width="240" height="16"/>
      <rect x="640" y="122" width="240" height="12"/>
      <rect x="640" y="142" width="240" height="8"/>
    </clipPath>
  </defs>
  <style>
    .gira { transform-origin: 1090px 150px; animation: gira 2.4s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .gira { animation: none; } }
  </style>
  <rect width="1280" height="320" fill="url(#fundo)"/>

  <!-- sol listrado -->
  <circle cx="760" cy="150" r="110" fill="url(#sol)" fill-opacity="0.9" clip-path="url(#listras)"/>

  <!-- grade em perspectiva no chao -->
  <g stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.2">
    <path d="M0 200H1280M0 222H1280M0 250H1280M0 286H1280"/>
    <path d="M640 160L-300 320M640 160L-60 320M640 160L180 320M640 160L420 320M640 160L640 320M640 160L860 320M640 160L1100 320M640 160L1340 320M640 160L1580 320"/>
  </g>
  <rect x="0" y="150" width="1280" height="50" fill="#120726" fill-opacity="0.0"/>
  <path d="M0 200H1280" stroke="#4D8BFF" stroke-opacity="0.8" stroke-width="2"/>

  <text x="64" y="118" font-size="64" font-weight="700" fill="#FF4FA3">Breeze</text>
  <text x="64" y="156" font-size="21" fill="#F5EEFF">a ventoinha inteligente do MacBook que virou servidor</text>
  <text x="64" y="186" font-size="16" fill="#C3A8E6">curva · histerese · emergência a 88 °C · applesmc · Python, só stdlib</text>
  <text x="64" y="246" font-size="16" fill="#FFB86B">[ OK ] controle manual ligado</text>

  <!-- ventoinha -->
  <circle cx="1090" cy="150" r="96" fill="#0a0418" fill-opacity="0.75" stroke="#7C5CFF" stroke-width="3"/>
  <circle cx="1090" cy="150" r="104" fill="none" stroke="#FF4FA3" stroke-opacity="0.35" stroke-width="2"/>
  <g class="gira">
    <g id="pa" fill="#FF4FA3">
      <path d="M1090 150 C1062 114 1068 68 1090 60 C1112 68 1118 114 1090 150 Z"/>
      <path d="M1090 150 C1062 114 1068 68 1090 60 C1112 68 1118 114 1090 150 Z" transform="rotate(72 1090 150)" fill="#4D8BFF"/>
      <path d="M1090 150 C1062 114 1068 68 1090 60 C1112 68 1118 114 1090 150 Z" transform="rotate(144 1090 150)" fill="#7C5CFF"/>
      <path d="M1090 150 C1062 114 1068 68 1090 60 C1112 68 1118 114 1090 150 Z" transform="rotate(216 1090 150)" fill="#FF4FA3"/>
      <path d="M1090 150 C1062 114 1068 68 1090 60 C1112 68 1118 114 1090 150 Z" transform="rotate(288 1090 150)" fill="#4D8BFF"/>
    </g>
  </g>
  <circle cx="1090" cy="150" r="15" fill="#120726" stroke="#FFB86B" stroke-width="3"/>
</svg>
