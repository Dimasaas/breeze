<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Breeze</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1052"/>
      <stop offset="1" stop-color="#1b3a8a"/>
    </linearGradient>
  </defs>
  <style>
    .gira { transform-origin: 1090px 160px; animation: gira 2.4s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .gira { animation: none; } }
  </style>
  <rect width="1280" height="320" fill="url(#fundo)"/>
  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M0 80H1280M0 160H1280M0 240H1280"/>
  </g>

  <!-- curva de fundo -->
  <polyline points="60,282 300,282 420,262 560,226 700,170 820,110 900,84" fill="none" stroke="#B388FF" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="8 6"/>

  <text x="64" y="132" font-size="58" font-weight="700" fill="#ffffff">Breeze</text>
  <text x="64" y="176" font-size="22" fill="#00E5FF">a ventoinha inteligente do MacBook que virou servidor</text>
  <text x="64" y="212" font-size="18" fill="#B388FF">curva · histerese · emergência a 88 °C · applesmc · Python, só stdlib</text>

  <!-- ventoinha -->
  <circle cx="1090" cy="160" r="104" fill="#0d0820" fill-opacity="0.55" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="3"/>
  <g class="gira">
    <g fill="#00E5FF" fill-opacity="0.9">
      <path d="M1090 160 C1060 120 1066 70 1090 62 C1114 70 1120 120 1090 160 Z"/>
      <path d="M1090 160 C1060 120 1066 70 1090 62 C1114 70 1120 120 1090 160 Z" transform="rotate(72 1090 160)" fill="#B388FF"/>
      <path d="M1090 160 C1060 120 1066 70 1090 62 C1114 70 1120 120 1090 160 Z" transform="rotate(144 1090 160)"/>
      <path d="M1090 160 C1060 120 1066 70 1090 62 C1114 70 1120 120 1090 160 Z" transform="rotate(216 1090 160)" fill="#B388FF"/>
      <path d="M1090 160 C1060 120 1066 70 1090 62 C1114 70 1120 120 1090 160 Z" transform="rotate(288 1090 160)"/>
    </g>
  </g>
  <circle cx="1090" cy="160" r="16" fill="#2a1052" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
</svg>
