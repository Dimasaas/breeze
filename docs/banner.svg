<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" font-family="'Segoe UI', 'Helvetica Neue', system-ui, sans-serif">
  <title>Breeze: a ventoinha inteligente do MacBook que virou servidor</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2D48"/>
      <stop offset="1" stop-color="#08202F"/>
    </linearGradient>
    <linearGradient id="termico" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.4" stop-color="#FACC15"/>
      <stop offset="0.7" stop-color="#F97316"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="calor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#DC2626" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#F97316" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#FACC15" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#EAF6FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
    <path id="pa" d="M0 -14 C-22 -40 -24 -78 0 -100 C24 -78 22 -40 8 -12 Z"/>
  </defs>
  <style>
    .gira { transform-origin: 1130px 160px; animation: gira 3s linear infinite; }
    .fluxo { stroke-dasharray: 26 18; animation: fluxo 1.6s linear infinite; }
    .pulsa { transform-origin: 990px 160px; animation: pulsa 4s ease-in-out infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @keyframes fluxo { to { stroke-dashoffset: -88; } }
    @keyframes pulsa { 50% { transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .gira, .fluxo, .pulsa { animation: none; } }
  </style>
  <rect width="1280" height="320" fill="url(#fundo)"/>

  <!-- mapa de calor atras do texto-direita -->
  <ellipse class="pulsa" cx="990" cy="160" rx="190" ry="150" fill="url(#calor)"/>

  <!-- linhas de corrente de ar -->
  <g fill="none" stroke="url(#ar)" stroke-width="3" stroke-linecap="round">
    <path class="fluxo" d="M960 66 C1020 44 1080 80 1262 58"/>
    <path class="fluxo" d="M930 120 C990 104 1060 128 1272 108" style="animation-delay:-.5s"/>
    <path class="fluxo" d="M930 206 C990 226 1060 200 1272 218" style="animation-delay:-1s"/>
    <path class="fluxo" d="M960 262 C1020 286 1080 250 1258 270" style="animation-delay:-.3s"/>
  </g>

  <!-- ventoinha -->
  <circle cx="1130" cy="160" r="112" fill="#0C2D48" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="3"/>
  <g class="gira">
    <g transform="translate(1130 160)" fill="#EAF6FF" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round">
      <use href="#pa"/>
      <use href="#pa" transform="rotate(72)"/>
      <use href="#pa" transform="rotate(144)"/>
      <use href="#pa" transform="rotate(216)"/>
      <use href="#pa" transform="rotate(288)"/>
    </g>
  </g>
  <circle cx="1130" cy="160" r="20" fill="#0C2D48" stroke="#38BDF8" stroke-width="6"/>
  <circle cx="1130" cy="160" r="7" fill="#38BDF8"/>

  <!-- logo -->
  <g transform="translate(36 40) scale(0.92)">
    <rect width="256" height="256" rx="56" fill="#0C2D48" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="3"/>
    <g transform="translate(0 -4)">
      <g fill="#EAF6FF" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" transform="translate(128 128) scale(1)">
        <use href="#pa" transform="scale(1)"/>
        <use href="#pa" transform="rotate(72)"/>
        <use href="#pa" transform="rotate(144)"/>
        <use href="#pa" transform="rotate(216)"/>
        <use href="#pa" transform="rotate(288)"/>
      </g>
      <circle cx="128" cy="128" r="17" fill="#0C2D48" stroke="#38BDF8" stroke-width="5"/>
      <circle cx="128" cy="128" r="6" fill="#38BDF8"/>
    </g>
    <path d="M176 218 C204 218 224 212 232 202 C240 190 226 180 216 190" fill="none" stroke="url(#termico)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- texto -->
  <text x="300" y="155" font-size="92" font-weight="300" letter-spacing="2" fill="#EAF6FF">Breeze</text>
  <text x="304" y="200" font-size="23" fill="#EAF6FF">a ventoinha inteligente do MacBook que virou servidor</text>
  <text x="304" y="240" font-size="18" fill="#38BDF8" letter-spacing="0.5">curva com histerese  ·  piso de 2000 rpm  ·  máximo a 88 °C</text>

  <!-- escala termica -->
  <rect x="304" y="262" width="360" height="8" rx="4" fill="url(#termico)"/>
  <text x="304" y="288" font-size="14" fill="#EAF6FF" fill-opacity="0.85">frio</text>
  <text x="664" y="288" font-size="14" text-anchor="end" fill="#EAF6FF" fill-opacity="0.85">88 °C</text>
</svg>
